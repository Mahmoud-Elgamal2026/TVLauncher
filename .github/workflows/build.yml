name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      # web/ is the UI source; this converts it for old Android TV WebViews (Android 7+) into app/src/main/assets
      - run: npm ci || npm install
      - run: npm run build
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Restore signing key
        env: { KEYSTORE_B64: "${{ secrets.KEYSTORE_B64 }}" }
        run: if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > app/tvlauncher.jks; fi
      - name: Bundle Shizuku (latest official release)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          url=$(curl -sfL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/RikkaApps/Shizuku/releases/latest | python3 -c "import json,sys;a=[x['browser_download_url'] for x in json.load(sys.stdin)['assets'] if x['name'].endswith('.apk')];print(a[0] if a else '')")
          if [ -n "$url" ]; then curl -sfL -o app/src/main/assets/shizuku.apk "$url" && ls -l app/src/main/assets/shizuku.apk; else echo "::warning::Shizuku not bundled"; fi
      - name: Build APK
        shell: bash
        env: { KEYSTORE_PASS: "${{ secrets.KEYSTORE_PASS }}" }
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
      # Surface the real Gradle error as an annotation (readable from the run summary / API)
      - name: Report build error
        if: failure()
        shell: bash
        run: |
          msg=$(grep -E -A12 "What went wrong|error:|e: |ERROR:|AAPT|Execution failed|Could not resolve|Cannot|Failed to" build.log | grep -v "^\s*at " | head -70 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
          echo "::error title=Gradle::${msg}"
      - run: cp app/build/outputs/apk/release/app-release.apk TVLauncher-v${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with: { name: TVLauncher-apk, path: TVLauncher-v*.apk }
      # Every build becomes a release, so the launcher can update itself from GitHub.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: TV Launcher v${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: TVLauncher-v${{ github.run_number }}.apk
